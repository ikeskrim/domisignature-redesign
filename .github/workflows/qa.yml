# The quality gate, on every push.
#
# The audits in scripts/ only protect the site if they actually run, and a check
# that depends on someone remembering to run it is not a check. This runs the
# same `npm run qa` a developer runs locally — same script, same nineteen checks — so
# there is no second, weaker definition of "green" that only CI believes.
#
# Budget is ten minutes. Lighthouse is deliberately absent: it needs a quiet,
# consistent machine to produce comparable numbers, and a shared CI runner is
# neither. It stays a local, deliberate measurement (`npm run audit:lighthouse`,
# results in design-review/lighthouse.md).

name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. qa.yml had no `permissions:` key, so the job's token took the
# repository default (BRIEF-AUDIT.md section 4, hygiene). Nothing here writes to
# the repository: checkout only reads it, and the npm and Playwright caches and
# the failure artifact go through the Actions runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    # The light system added three browser-driven checks (ground, focus,
    # paper); together they add about six minutes on a runner. Stage 6 added
    # three more (motion-tier, focus-motion, typeset-clip), and the whole gate
    # takes about fourteen minutes on a desktop machine, so the ceiling has
    # room for a slower runner plus install and build.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies only, at high severity: it fails the job on a
      # high or critical advisory in a dependency that ships. It never runs
      # `npm audit fix`; a fix is a reviewed upgrade in its own commit, and one
      # that crosses a major or changes output is the owner's call
      # (BRIEF-AUDIT.md section 4.4). Dev tooling advisories are out of scope.
      # It reads the registry's advisory database, so a new advisory or a
      # registry outage can turn an unchanged tree red. The verdict is held back
      # until the last step, so a red audit never hides the QA gate's result.
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Only Chromium. WebKit and Firefox are for the cross-browser pass, which
      # is a human-reviewed capture run, not a pass/fail gate.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No `--with-deps`. That runs apt-get, which the browser cache cannot cover
      # and which is the only step here that depends on Ubuntu's mirrors being
      # healthy — one run hung on them for fourteen minutes and hit the job
      # ceiling. The ubuntu-latest image already ships the shared libraries
      # Chromium needs, so this is pure risk for no benefit. If a library ever
      # does go missing, Chromium fails to launch and the QA gate says so
      # loudly; it cannot fail quietly.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5

      # Built as a production deployment on purpose. The SEO flips — robots.txt,
      # the per-page robots meta, canonicals — are decided at BUILD time, so a
      # default build would have the launch check asserting against the wrong
      # environment and passing for the wrong reason.
      - name: Build
        run: npm run build
        env:
          VERCEL: "1"
          VERCEL_ENV: production

      - name: QA gate
        run: npm run qa

      # Only on failure, and only the files an audit writes when it finds
      # something — enough to see what broke without downloading a green run.
      - name: Upload audit output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-output
          path: |
            design-review/*.json
            design-review/redirect-map.md
          retention-days: 7
          if-no-files-found: ignore

      # The dependency audit's verdict, reported, not enforced - for now. On
      # 2026-09-15 the audit names four findings whose fixes are the owner's
      # call, not a reviewed patch: next's bundled postcss and next itself (fixed
      # only in next 16, a major), sharp (fixed in 0.35.4, a major), and nanoid
      # (a transitive in-range bump that needs its own approved commit). Failing
      # the job on them would keep CI red on a tree nobody may change. This
      # annotates every run instead; make it `exit 1` again once those are
      # decided. It runs last, so it never hides the QA gate's result.
      - name: Dependency audit verdict
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::warning::npm audit found a high or critical advisory in a production dependency (known on 2026-09-15: next/postcss, sharp, nanoid - owner decisions); see the Dependency audit step"
